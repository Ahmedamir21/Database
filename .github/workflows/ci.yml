# The checks that run on every push: the API is tested without SQL Server, the client is built
# (which is also the only way to be sure that every page parses), and the deployment entry
# point is exercised in the two scenarios of docs/DEPLOYMENT.md.
name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: API (tests and the deployment entry point)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:deploy

  client:
    name: client (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
